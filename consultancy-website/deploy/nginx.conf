# Nginx config for a VPS deployment (Hostinger / DigitalOcean / Lightsail / EC2).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/consultancy
#   sudo ln -s /etc/nginx/sites-available/consultancy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com
#
# Replace example.com with the real domain everywhere below.
# Certbot rewrites this file to add the TLS block after you run it.

# --- Redirect the bare domain to www (pick ONE canonical host and stick to it,
#     otherwise Google indexes both and splits your ranking) -----------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;

    root /var/www/consultancy/dist;
    index index.html;

    # --- Logs ---
    access_log /var/log/nginx/consultancy.access.log;
    error_log  /var/log/nginx/consultancy.error.log;

    # --- Security headers ---
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    # Certbot adds HSTS; do not enable it before HTTPS works, or you lock
    # visitors out of a site that cannot yet serve TLS.

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # woff2 is already compressed — do not gzip it again.

    # --- Pretty URLs: /pricing serves /pricing.html ---
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # --- Long cache for fingerprint-free static assets ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sitemap.xml { expires 1d; }
    location = /robots.txt  { expires 1d; }

    # --- Optional: the lead-capture API, if you run backend/server.js ---
    # Everything else stays static and is served by Nginx directly.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- The admin dashboard: restrict it. Uncomment the allow/deny lines and
    #     put your own IP in, or delete this block and use an SSH tunnel. ---
    location /admin {
        # allow 203.0.113.45;   # your office IP
        # deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /404.html { internal; }
    error_page 404 /404.html;

    # Block dotfiles (.git, .env) if any ever end up in the web root.
    location ~ /\. { deny all; }

    client_max_body_size 2m;
}
