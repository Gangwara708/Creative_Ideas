# Netlify deployment config.
# Connect the repo in Netlify and set "Base directory" to consultancy-website.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs: /services/neet-counselling instead of ...-counselling.html
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers also live in src/static/_headers, which Netlify reads
# automatically. Duplicating them here is unnecessary.
